# Builds one Wails project for macOS, Linux and Windows, then publishes the
# binaries as a GitHub release. Called by release.yml, once per project.
#
# Nothing is published unless all three builds succeed.
#
# Signing: no paid certificates are used, so each platform has a one-time
# "unknown developer" prompt that the release notes explain.
#   - macOS: the universal app is ad-hoc signed and the signature is verified
#     after packaging. Unsigned arm64 code is killed on Apple Silicon and a
#     broken signature shows as "damaged", so a build whose signature does not
#     verify fails here instead of reaching users.
#   - Windows and Linux binaries are not signed.
name: Release Wails project

on:
  workflow_call:
    inputs:
      name:
        description: Project name, which is its directory name. Prefixes every asset.
        type: string
        required: true
      dir:
        description: Path of the project directory, relative to the repository root.
        type: string
        required: true
      version:
        description: Version to release, without a leading v.
        type: string
        required: true
      tag:
        description: Git tag to create for the release.
        type: string
        required: true
      prerelease:
        description: Mark the release as a pre-release.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: macos-universal
            runner: macos-latest
            platform: darwin/universal
          - target: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            # Ubuntu 24.04 has webkit2gtk 4.1 only, which needs this tag.
            tags: webkit2_41
          - target: windows-amd64
            runner: windows-latest
            platform: windows/amd64
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.dir }}
    # Values are passed through the environment, never interpolated into scripts.
    env:
      NAME: ${{ inputs.name }}
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TAGS: ${{ matrix.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that was pushed, even if main has moved on since.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the Wails CLI
        run: |
          # Match the library version in go.mod so the CLI and runtime agree.
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: ${{ inputs.dir }}/frontend
        run: npm ci

      - name: Set the app version
        run: |
          # Becomes the macOS bundle version and the Windows file version. Both
          # want numeric parts only, so a pre-release suffix is dropped. This
          # edits the CI checkout only.
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            cfg.info = { ...cfg.info, productVersion: process.env.VERSION.split("-")[0] };
            fs.writeFileSync("wails.json", JSON.stringify(cfg, null, 2) + "\n");
          '
          echo "EXE=$(node -p 'require("./wails.json").outputfilename')" >> "$GITHUB_ENV"

      - name: Build
        run: wails build -clean -platform "$PLATFORM" ${TAGS:+-tags "$TAGS"}

      - name: Sign, verify and package (macOS)
        if: runner.os == 'macOS'
        run: |
          apps=(build/bin/*.app)
          [ "${#apps[@]}" -eq 1 ] || { echo "::error::expected one .app in build/bin, found ${#apps[@]}"; exit 1; }
          app=${apps[0]}

          # Wails already ad-hoc signs the bundle. Sign it again so the release
          # does not depend on that, then check the result.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          binary="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs=$(lipo -archs "$binary")
          if [[ $archs != *arm64* || $archs != *x86_64* ]]; then
            echo "::error::expected a universal binary, got: $archs"
            exit 1
          fi

          # ditto keeps the symlinks and attributes that the signature covers.
          mkdir dist
          zip="dist/${NAME}_${VERSION}_macos_universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"

          # Verify what users will download, not just the build tree.
          check=$(mktemp -d)
          ditto -x -k "$zip" "$check"
          codesign --verify --deep --strict --verbose=2 "$check"/*.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          # tar keeps the executable bit, which artifact upload would drop.
          tar -C build/bin -czf "dist/${NAME}_${VERSION}_linux_amd64.tar.gz" "$EXE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp "build/bin/${EXE}.exe" "dist/${NAME}_${VERSION}_windows_amd64.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-${{ inputs.version }}-${{ matrix.target }}
          path: ${{ inputs.dir }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ inputs.tag }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ inputs.name }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.name }}-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS)

          cat > notes.md <<'EOF'
          Built from commit @SHA@. Verify a download with `SHA256SUMS`.

          ## Downloads

          | Platform | File |
          |---|---|
          | macOS, Apple Silicon and Intel | `@NAME@_@VERSION@_macos_universal.zip` |
          | Windows, x64 | `@NAME@_@VERSION@_windows_amd64.exe` |
          | Linux, x64 | `@NAME@_@VERSION@_linux_amd64.tar.gz` |

          ## First launch

          These builds are not signed with a paid developer certificate, so macOS
          and Windows ask you to approve the app once.

          - **macOS:** the app is ad-hoc signed but not notarized, so Gatekeeper
            blocks a copy downloaded in a browser. Either open **System Settings →
            Privacy & Security** and choose **Open Anyway**, or clear the
            quarantine flag once with `xattr -dr com.apple.quarantine <app>.app`.
            Files fetched with `curl` or `gh release download` are not quarantined.
          - **Windows:** SmartScreen may show "Windows protected your PC". Choose
            **More info → Run anyway**. The Microsoft WebView2 runtime is needed;
            current Windows 10 and 11 include it.
          - **Linux:** needs GTK 3 and WebKitGTK 4.1, which Ubuntu 22.04 and later
            provide: `sudo apt install libgtk-3-0 libwebkit2gtk-4.1-0`. Then
            `tar xzf` the archive and run the binary.
          EOF
          sed -i -e "s/@NAME@/$NAME/g" -e "s/@VERSION@/$VERSION/g" -e "s/@SHA@/$GITHUB_SHA/g" notes.md

          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$NAME v$VERSION" --notes-file notes.md)
          [ "$PRERELEASE" = true ] && args+=(--prerelease)

          # gh publishes the release only after every asset has uploaded.
          gh release create "$TAG" "${args[@]}" dist/* SHA256SUMS

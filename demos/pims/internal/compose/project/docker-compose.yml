# Local services for the PIMS demo. Rendered into the PIMS workspace and run
# by the app with `docker compose -p pims`. Values in ${...} are supplied by
# the app through the docker process environment, never written to disk.
name: pims

services:
  mysql:
    image: mysql:8.4
    command:
      # Debezium reads the binlog: row-based, full row images, GTIDs on.
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      # Store and emit DATETIME values in UTC so latency maths is unambiguous.
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: pims
      MYSQL_USER: pims
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-33306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # ping succeeds even when access is denied, so no password is needed
      # (and none appears in the container's process list).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  connect:
    build: ./connect
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONNECT_HOST_PORT:-8083}:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-}
      CONNECT_GROUP_ID: pims-connect
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      # Internal topics live in Confluent Cloud; RF 3 is required there.
      CONNECT_CONFIG_STORAGE_TOPIC: _pims-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _pims-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _pims-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      # Worker, producer and consumer all authenticate to Confluent Cloud.
      CONNECT_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY:-}" password="${KAFKA_API_SECRET:-}";
      CONNECT_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY:-}" password="${KAFKA_API_SECRET:-}";
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY:-}" password="${KAFKA_API_SECRET:-}";
      # Avro keeps schemas in Schema Registry, which Tableflow requires.
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      CONNECT_KEY_CONVERTER_BASIC_AUTH_CREDENTIALS_SOURCE: USER_INFO
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_API_KEY:-}:${SCHEMA_REGISTRY_API_SECRET:-}
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      CONNECT_VALUE_CONVERTER_BASIC_AUTH_CREDENTIALS_SOURCE: USER_INFO
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_API_KEY:-}:${SCHEMA_REGISTRY_API_SECRET:-}
      # Lets connector configs reference ${env:...} so secrets are never
      # posted to, or returned by, the Connect REST API.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      PIMS_KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      PIMS_KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
      PIMS_MYSQL_DEBEZIUM_PASSWORD: ${MYSQL_DEBEZIUM_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  duckdb:
    build: ./duckdb
    # Idle container; PIMS runs queries with `docker compose exec`.
    command: ["sleep", "infinity"]
    init: true

volumes:
  mysql-data:

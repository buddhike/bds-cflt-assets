<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for appicon.png. A medical cross with a live pulse running through it:
       patient records changing in real time. Shape follows the macOS 824px icon grid. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7fe0"/>
      <stop offset="1" stop-color="#0b2a4f"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="417" y="257" width="190" height="510" rx="44" fill="#ffffff"/>
  <rect x="257" y="417" width="510" height="190" rx="44" fill="#ffffff"/>
  <polyline points="170,512 372,512 424,424 494,648 560,336 618,560 656,512 854,512"
            fill="none" stroke="#0d3563" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="170,512 372,512 424,424 494,648 560,336 618,560 656,512 854,512"
            fill="none" stroke="url(#pulse)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
